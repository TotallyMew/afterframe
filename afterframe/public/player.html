<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121416">
  <link rel="icon" href="/art/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/player.css">
  <script type="module" src="/player.js"></script>
  <title>Watch · Afterframe</title>
</head>
<body>
  <a href="#title-page" class="skip-link">Skip to playback</a>
  <header class="player-bar">
    <div class="player-bar-inner">
      <a class="brand" href="/#home" aria-label="Afterframe home">
        <img src="/art/favicon.svg" alt="" width="25" height="25">afterframe
      </a>
      <a id="player-return" class="plain-link" href="/#home">Back to Afterframe</a>
    </div>
  </header>
  <main id="title-page" class="title-page" tabindex="-1">
    <div class="title-status" role="status">Loading title…</div>
  </main>
  <div id="toast" class="toast" hidden>
    <span role="status"></span>
    <button type="button" class="plain-link" data-action="undo" hidden>Undo</button>
    <a class="plain-link" href="/?panel=account#home" data-player-signin hidden>Sign in</a>
    <a class="plain-link" href="/#watchlist" data-recover-library hidden>Recover change</a>
  </div>
</body>
</html>
