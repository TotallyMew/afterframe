[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["/Dockerfile", "/.dockerignore", "/railway.toml", "/package*.json", "/packages/**", "/apps/**", "/afterframe/package.json", "/afterframe/public/**"]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 90
restartPolicyType = "ON_FAILURE"
