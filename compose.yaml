services:
  web:
    build:
      context: .
      target: web
    environment:
      PORT: ${AFTERFRAME_PORT:-4173}
      AFTERFRAME_API_URL: http://api:8080
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${AFTERFRAME_PORT:-4173}:${AFTERFRAME_PORT:-4173}"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('node:http'); const host=process.env.AFTERFRAME_ORIGIN?new URL(process.env.AFTERFRAME_ORIGIN).host:'127.0.0.1:'+process.env.PORT; const check=(path,method='GET')=>new Promise(resolve=>{const req=http.request({host:'127.0.0.1',port:process.env.PORT,path,method,headers:{host}},r=>{r.resume();resolve(r.statusCode>=200&&r.statusCode<300);});req.on('error',()=>resolve(false));req.end();}); Promise.all([check('/api/health'),check('/','HEAD')]).then(r=>process.exit(r.every(Boolean)?0:1));"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build:
      context: .
      target: api
    environment:
      PORT: 8080
      AFTERFRAME_WEB_PORT: ${AFTERFRAME_PORT:-4173}
      AFTERFRAME_ACCOUNTS_DATABASE_URL: postgresql://afterframe:${POSTGRES_PASSWORD:-afterframe-local}@db:5432/afterframe
      DATABASE_URL: postgresql://afterframe:${POSTGRES_PASSWORD:-afterframe-local}@db:5432/afterframe
      TMDB_READ_TOKEN: ${TMDB_READ_TOKEN:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
      EMNEX_API_KEY: ${EMNEX_API_KEY:-}
      AFTERFRAME_REGISTRATION: ${AFTERFRAME_REGISTRATION:-}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const host=process.env.AFTERFRAME_ORIGIN?new URL(process.env.AFTERFRAME_ORIGIN).host:'localhost:'+process.env.AFTERFRAME_WEB_PORT; require('node:http').get('http://127.0.0.1:8080/api/health',{headers:{host}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: afterframe
      POSTGRES_USER: afterframe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afterframe-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U afterframe -d afterframe"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres-data:
